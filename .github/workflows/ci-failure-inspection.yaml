name: Jenkins CI Failure Inspection

on:
  # schedule:
  #   # Runs Tue–Sat at 11:00 UTC (4:00 AM PST) — after all Jenkins jobs from the prior day complete
  #   - cron: '0 11 * * 2-6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — print failures without creating issues'
        required: false
        default: 'false'
        type: boolean
      version_filter:
        description: 'Only process builds matching this version prefix (e.g. "head" for head-only builds)'
        required: false
        default: ''
        type: string

concurrency:
  group: ci-failure-inspection-test
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect CI failures and create issues
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Run CI inspection
        working-directory: cypress/jenkins/inspector
        env:
          GITHUB_TOKEN: ${{ secrets.INSPECTOR_PERSONAL_GH_TOKEN }}
          # Production splits these across two Vault tokens (issues-write and
          # organization_projects-write). The personal PAT carries both repo and project
          # scopes, so it stands in for both here while exercising the same code path.
          GH_PROJECT_TOKEN: ${{ secrets.INSPECTOR_PERSONAL_GH_TOKEN }}
          COPILOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JENKINS_AUTH: ${{ secrets.INSPECTOR_JENKINS_AUTH }}
          JENKINS_BASE_URL: ${{ secrets.INSPECTOR_JENKINS_BASE_URL }}
          JENKINS_JOB_PATH: ${{ secrets.INSPECTOR_JENKINS_JOB_PATH }}
          GITHUB_ORG: yonasberhe23
          GITHUB_REPO: fleet-test
          GITHUB_PROJECT_NUMBER: 1
          GITHUB_PROJECT_OWNER: user
          GITHUB_ISSUE_LABELS: area/automation-test-ui,kind/flaky-test
          STATUS_FIELD_ID: PVTSSF_lAHOB5cdPM4BaeivzhVV5Hs
          BACKLOG_OPTION_ID: f75ad846
          INSPECTOR_BUILD_WINDOW: ${{ vars.INSPECTOR_BUILD_WINDOW }}
          INSPECTOR_ANCHOR_DESCRIPTION: ${{ vars.INSPECTOR_ANCHOR_DESCRIPTION }}
          INSPECTOR_VERSION_FILTER: ${{ inputs.version_filter }}
          INSPECTOR_SLACK_THRESHOLD: '50'
          INSPECTOR_SLACK_NOTIFICATION: 'false'
          UI_QA_SLACK_BOT_TOKEN: ${{ secrets.UI_QA_SLACK_BOT_TOKEN }}
          UI_QA_SLACK_CHANNEL: ${{ secrets.UI_QA_SLACK_CHANNEL }}
          UI_QA_SLACK_GROUP_ID: ${{ secrets.UI_QA_SLACK_GROUP_ID }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: node src/inspect.js