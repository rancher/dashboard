name: Dependabot Milestone

# Automatically assigns the branch-derived milestone (see branches-metadata.json,
# resolved via scripts/get-branch-metadata.sh) to Dependabot pull requests so they
# satisfy the milestone validation performed by valid-pr.yaml / pr-check-milestone.sh.
#
# - pull_request_target: assigns the milestone as soon as a Dependabot PR opens.
#   This trigger is used (instead of pull_request) because Dependabot's
#   pull_request token is read-only and cannot set a milestone. No PR code is
#   checked out or executed, only the trusted script from the base branch runs.
# - schedule / workflow_dispatch: sweeps every open Dependabot PR as a safety net.
#
# The milestone is assigned with a GitHub App token (not the default GITHUB_TOKEN).
# Actions performed with GITHUB_TOKEN do not trigger further workflow runs, so a
# milestone set with it never re-triggers valid-pr.yaml's `milestoned` event and the
# "Branch Milestone" check stays red even though the milestone now exists. A milestone
# set with an App token does cascade, so the check re-runs and passes. This mirrors the
# strategy already used by port-pr.yaml.
on:
  pull_request_target:
    types: [opened, reopened]
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

# Restrictive baseline permissions for all jobs
permissions:
  contents: read

jobs:
  assign-on-open:
    name: Assign milestone on Dependabot PR open
    if: >-
      github.repository_owner == 'rancher' &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Read secrets
        uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/app-credentials appId | APPID;
            secret/data/github/repo/${{ github.repository }}/github/app-credentials privateKey | PRIVATEKEY
      - name: Generate Token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.APPID }}
          private-key: ${{ env.PRIVATEKEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Assign milestone
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          MODE: event
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ./.github/workflows/scripts/dependabot-milestone.sh

  sweep-open-prs:
    name: Sweep open Dependabot PRs
    if: >-
      github.repository_owner == 'rancher' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Read secrets
        uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/app-credentials appId | APPID;
            secret/data/github/repo/${{ github.repository }}/github/app-credentials privateKey | PRIVATEKEY
      - name: Generate Token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.APPID }}
          private-key: ${{ env.PRIVATEKEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Sweep and assign milestones
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          MODE: sweep
        run: ./.github/workflows/scripts/dependabot-milestone.sh
