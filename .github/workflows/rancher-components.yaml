name: rancher-components
on:
  pull_request:
    paths:
      - 'pkg/rancher-components/**/*'
    branches:
      - master

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
      - name: Setup env
        uses: ./.github/actions/setup

      - name: Verify build
        run: yarn build:lib

  validate-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
      - name: Setup env
        uses: ./.github/actions/setup

      - name: Run linters
        run: yarn lint:lib
