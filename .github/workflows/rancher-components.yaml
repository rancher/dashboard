name: rancher-components
on:
  pull_request:
    paths:
      - 'pkg/rancher-components/**/*'
    branches:
      - master

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - name: Setup env
        uses: ./.github/actions/setup

      - name: Verify build
        run: yarn build:lib

  validate-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - name: Setup env
        uses: ./.github/actions/setup

      - name: Run linters
        run: yarn lint:lib
