name: Publish Cypress Suite Package

on:
  push:
    tags:
      - 'cypress-pkg-v*'
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
    outputs:
      build-release-cypress-suite-status: 
        value: ${{ jobs.build.outputs.build-status }}

defaults:
  run:
    shell: bash
    working-directory: ./cypress

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'rancher/dashboard' && (github.event_name == 'workflow_call' || (github.event_name == 'push' && github.event.ref == 'refs/tags/${{ github.ref_name }}'))
    outputs:
      build-status: ${{ job.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

        # `install: false` - the install runs below, after npm has been updated.
        # `working-directory` must be explicit: a workflow-level `defaults.run`
        # does not propagate into composite action steps.
      - name: Setup env
        uses: ./.github/actions/setup
        with:
          install: 'false'
          working-directory: ./cypress

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          scope: '@rancher'

      # Ensure latest npm version is installed - 11.5.1 is required to pass OIDC token to npm publish
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install packages
        run: npm run install:ci

      - name: Build Cypress Package
        run: yarn build-pkg

      - name: Publish Cypress Package to npm
        run: yarn publish-pkg
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
