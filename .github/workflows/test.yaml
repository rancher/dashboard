name: Tests
on:
  push:
    branches:
      - master
      - 'release-*'
  pull_request:
    branches:
      - master
      - 'release-*'
  # Required for the merge queue. A required status check that does not report on
  # `merge_group` stalls every merge group until the status-check timeout and then
  # ejects the pull request, so this trigger and `ci-gate` must stay in step.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: true

# Only `pull_request` runs may be cancelled.
#   - A cancelled `merge_group` run reports `cancelled`, which the merge queue reads
#     as a failure and ejects the pull request.
#   - A cancelled `push` run loses the post-merge master signal, which is the only
#     e2e coverage of merged code.
# `github.event_name` is part of the key so a PR run and a push run for the same ref
# can never cancel one another.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEST_USERNAME: admin
  TEST_PASSWORD: password
  CATTLE_BOOTSTRAP_PASSWORD: password
  TEST_BASE_URL: https://127.0.0.1.sslip.io
  API: https://127.0.0.1.sslip.io
  # In a pull request the video of a spec that passes is replaced by a placeholder, unless the PR has the ci/videos-all label
  TEST_NO_PASSED_VIDEOS: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci/videos-all') }}
  # Build the dashboard to use in tests. When set to false it will grab `latest` from CDN (useful for running e2e tests quickly)
  BUILD_DASHBOARD: true

  E2E_RANCHER_LOG: rancher.log
  E2E_BUILD_DIST_NAME: dist
  E2E_BUILD_DIST_DIR: dist
  E2E_BUILD_DIST_EMBER_NAME: dist_ember
  E2E_BUILD_DIST_EMBER_DIR: dist_ember

jobs:
  # Verify licenses.json is up to date with the packages that end up in the
  # bundle. Fails the PR when a dependency was added, removed, or upgraded
  # without regenerating licenses.json (see scripts/analyze-licenses).
  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - name: Setup env
        uses: ./.github/actions/setup
      - name: Build with bundle analyzer
        run: ANALYZE_LICENSES=true yarn build
      - name: Verify licenses.json is up to date
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./scripts/analyze-licenses

  extract-e2e-runtime-rancher-version:
    # PR-only. On `merge_group` `github.base_ref` is empty and `github.ref_name` is
    # `gh-readonly-queue/master/pr-N-<sha>`, so get-branch-metadata.sh would resolve
    # against a branch that does not exist in branches-metadata.json.
    if: >-
      github.event_name != 'merge_group' &&
      !contains(github.event.pull_request.labels.*.name, 'ci/skip-e2e')
    runs-on: ubuntu-latest
    outputs:
      runtime-rancher-version: ${{ steps.extract.outputs.runtime-rancher-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - name: Extract Rancher version
        id: extract
        run: |
          BRANCH_DATA=$(./scripts/get-branch-metadata.sh ${{ github.base_ref || github.ref_name }} --local 2>/dev/null)
          VERSION=$(echo "$BRANCH_DATA" | jq -r '.e2e["runtime-rancher-version"]')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Warning: Rancher version not found for branch '${{ github.base_ref || github.ref_name }}', 'runtime-rancher-version' will be empty."
          fi
          echo "runtime-rancher-version=$VERSION" >> "$GITHUB_OUTPUT"

  e2e-ui-build:
    # PR-only. Deliberately skipped in the merge queue; `ci-gate` allows the skip.
    if: >-
      github.event_name != 'merge_group' &&
      !contains(github.event.pull_request.labels.*.name, 'ci/skip-e2e')
    needs: extract-e2e-runtime-rancher-version
    runs-on: ubuntu-latest
    outputs:
      runtime-rancher-version: ${{ needs.extract-e2e-runtime-rancher-version.outputs.runtime-rancher-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - name: Setup env
        uses: ./.github/actions/setup
      - name: Build e2e
        run: yarn e2e:build
      - name: Upload e2e build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.E2E_BUILD_DIST_NAME }}
          path: ${{ env.E2E_BUILD_DIST_DIR }}/
          if-no-files-found: error
          retention-days: 10
          compression-level: 9
      - name: Upload e2e build ember
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.E2E_BUILD_DIST_EMBER_NAME }}
          path: ${{ env.E2E_BUILD_DIST_EMBER_DIR }}/
          if-no-files-found: error
          retention-days: 10
          compression-level: 9

  e2e-test:
    # PR-only. Deliberately skipped in the merge queue; `ci-gate` allows the skip.
    if: >-
      github.event_name != 'merge_group' &&
      !contains(github.event.pull_request.labels.*.name, 'ci/skip-e2e')
    needs: e2e-ui-build
    strategy:
      fail-fast: false
      matrix:
        role: [
          { username: 'admin', tag: '@adminUser' }, 
          { username: 'standard_user', tag: '@standardUser' }
        ]
        features:  [
          ['@navigation', '@extensions'],
          ['@charts'],
          ['@explorer'],
          ['@explorer2'],
          ['@virtualizationMgmt', '@fleet'],
          ['@generic', '@globalSettings'],
          ['@manager'],
          ['@userMenu', '@usersAndAuths'],
          ['@components'],
        ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - name: Setup env
        uses: ./.github/actions/setup

      # Installing fixed version of Chrome since latest version does not work (128 didn't work)
      # Leaving this here again in case we need to pin to a specific Chrome version in the future
      # - name: Install Chrome
      #   uses: ./.github/actions/install-chrome
      #   with:
      #     chrome-version: '143.0.7499.192-1'
      #     chrome-version-checksum:

      - name: Download e2e build
        uses:  actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
         name: ${{ env.E2E_BUILD_DIST_NAME }}
         path: ${{ env.E2E_BUILD_DIST_DIR }}
      - name: Download e2e build ember
        uses:  actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
         name: ${{ env.E2E_BUILD_DIST_EMBER_NAME }}
         path: ${{ env.E2E_BUILD_DIST_EMBER_DIR }}
      
      - name: Run Rancher
        run: yarn e2e:k3s
      
      - name: Setup Rancher and user
        run: |
          yarn e2e:prod
        env: 
          RANCHER_VERSION: ${{ needs.e2e-ui-build.outputs.runtime-rancher-version }}
          GREP_TAGS: ${{ matrix.role.tag }}Setup+${{ matrix.features[0] }} --@jenkins ${{ matrix.role.tag }}Setup+${{ matrix.features[1] || matrix.features[0] }} --@jenkins
          TEST_USERNAME: admin
          TEST_ONLY: setup
      - name: Detect Rancher license (Prime vs Community)
        id: detect-prime
        run: |
          IS_PRIME=$(curl -sk "$API/rancherversion" | jq -r '.RancherPrime // "false"')
          echo "Detected RancherPrime=$IS_PRIME"
          echo "is-prime=$IS_PRIME" >> "$GITHUB_OUTPUT"

      - name: Run user tests
        run: |
          yarn e2e:prod
          [ "$BUILD_DASHBOARD" != "false" ] || exit 0
        env:
          RANCHER_VERSION: ${{ needs.e2e-ui-build.outputs.runtime-rancher-version }}
          TEST_SKIP: setup
          GREP_TAGS: ${{ matrix.role.tag }}+${{ matrix.features[0] }} --@jenkins${{ steps.detect-prime.outputs.is-prime == 'true' && ' --@noPrime' || '' }} ${{ matrix.role.tag }}+${{ matrix.features[1] || matrix.features[0] }} --@jenkins${{ steps.detect-prime.outputs.is-prime == 'true' && ' --@noPrime' || '' }}
          TEST_USERNAME: ${{ matrix.role.username }}

      - name: Fetch Rancher Logs
        if: ${{ failure() }}
        run: yarn k3s:local:logs

      - name: Create Artifacts Folder
        if: ${{ always() }}
        run: |
          mkdir artifacts
          cp -r cypress/screenshots artifacts 2>/dev/null || :
          cp -r cypress/videos artifacts 2>/dev/null || :
          cp -r cypress/reports/* artifacts || :
          cp ${{ env.E2E_RANCHER_LOG }} artifacts/rancher.logs 2>/dev/null || :
          cp browser-logs/out.html artifacts/browser-logs.html 2>/dev/null || :

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: ${{github.run_number}}-${{github.run_attempt}}-artifacts-${{ matrix.role.tag }}${{ matrix.features[0] }}${{ matrix.features[1] }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 5
          compression-level: 9

  a11y-test:
    # PR-only. Deliberately skipped in the merge queue; `ci-gate` allows the skip.
    if: >-
      github.event_name != 'merge_group' &&
      !contains(github.event.pull_request.labels.*.name, 'ci/skip-e2e')
    needs: e2e-ui-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - name: Setup env
        uses: ./.github/actions/setup

      # - name: Install Chrome
      #   uses: ./.github/actions/install-chrome
      #   with:
      #     chrome-version: '143.0.7499.192-1'
      #     chrome-version-checksum:

      - name: Download e2e build
        uses:  actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.E2E_BUILD_DIST_NAME }}
          path: ${{ env.E2E_BUILD_DIST_DIR }}
      - name: Download e2e build ember
        uses:  actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.E2E_BUILD_DIST_EMBER_NAME }}
          path: ${{ env.E2E_BUILD_DIST_EMBER_DIR }}
      
      - name: Run Rancher
        run: yarn e2e:docker
      
      - name: Setup Rancher and user
        run: |
          yarn e2e:prod
        env: 
          RANCHER_VERSION: ${{ needs.e2e-ui-build.outputs.runtime-rancher-version }}
          GREP_TAGS: "@adminUserSetup+@accessibility --@jenkins"
          TEST_USERNAME: admin
          TEST_ONLY: setup
      - name: Run user tests
        run: |
          yarn e2e:prod
          [ "$BUILD_DASHBOARD" != "false" ] || exit 0
        env: 
          RANCHER_VERSION: ${{ needs.e2e-ui-build.outputs.runtime-rancher-version }}
          TEST_SKIP: setup
          GREP_TAGS: "@adminUser+@accessibility --@jenkins"
          TEST_USERNAME: admin
          TEST_A11Y: true
          TEST_NO_VIDEOS: true          

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-report
          path: cypress/accessibility

      # Ratchet gate: fail only on a11y violations that are not in the committed
      # baseline (cypress/e2e/tests/accessibility/baseline.json). Enforced by
      # default; set the A11Y_RATCHET_ENFORCE repo variable to 'false' to drop
      # back to report-only without a code change.
      #
      # Deliberately `success()`, not `always()`. Violations are collected with
      # skipFailures, so they never redden the test step -- a red test step means
      # the run itself broke, and Cypress still fires `after:run`, leaving a report
      # that is a strict subset of the baseline. Comparing it would find nothing
      # new and print a green ratchet directly beneath the failure. The report is
      # still uploaded on failure by the step above, so nothing is lost.
      - name: A11y ratchet
        if: success()
        run: yarn a11y:compare
        env:
          A11Y_RATCHET_ENFORCE: ${{ vars.A11Y_RATCHET_ENFORCE || 'true' }}

  # ---------------------------------------------------------------------------
  # The merge-queue check set: unit-test, i18n, lint, type-check. These four run on
  # every event, including `merge_group`, and are what the queue verifies against
  # the rebased result. They mirror the jobs in build-test.yaml.
  #
  # Do not add a job that consumes secrets to this group. Merge-group runs execute
  # on a branch in this repository, so unlike fork pull request runs they are
  # trusted and have full secret access before the code has been merged.
  # ---------------------------------------------------------------------------
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      
      - name: Run tests
        uses: ./.github/actions/unit-tests

      - name: Collect Coverage
        run: |
          mkdir -p coverage-artifacts/coverage
          cp coverage/unit/coverage-final.json coverage-artifacts/coverage/coverage-unit.json
          cp -r coverage/unit/ coverage-artifacts/coverage/unit/

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{github.run_number}}-${{github.run_attempt}}-coverage
          path: coverage-artifacts/**/*

      - name: Upload unit test junit file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{github.run_number}}-${{github.run_attempt}}-unit-tests
          path: unit-test-reports/*

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      - name: Run i18n lint
        uses: ./.github/actions/i18n-lint

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      - name: Run tests
        uses: ./.github/actions/lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      - name: Run type check
        uses: ./.github/actions/type-check

  check-i18n:
    # PR-only. Advisory (`-x` swallows failures) and not worth merge-queue latency.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
      
      - name: Install packages
        run: yarn install:ci
      
      - name: Run i18n string check
        run: |
          # Falure won't fail the job (remove -x when all current issues are fixed)
          ./scripts/check-i18n -s -x

  check-i18n-links:
    # PR-only. Hits every external http link, so it fails for reasons unrelated to
    # the change under test — never put it on the merge critical path.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
      
      - name: Install packages
        run: yarn install:ci
      
      - name: Run check of all http links in the i18n files (broken link check)
        run: |
          ./scripts/check-i18n-links

  # coverage:
  #   runs-on: ubuntu-latest
  #   needs:
  #     - unit-test
  #   steps:
  #     - uses: actions/checkout@v3
  #       with:
  #         fetch-depth: 1

  #     - uses: actions/setup-node@v6
  #       with:
  #         node-version-file: '.nvmrc'

  #     - name: Download Coverage Artifacts
  #       uses: actions/download-artifact@v3
  #       with:
  #         name: ${{github.run_number}}-${{github.run_attempt}}-coverage

  #     - name: Install Codecov CLI
  #       uses : .github/workflows/scripts/install-codecov.sh
  #       with:
  #         codecov-version:
  #         codecov-version-checksum:

  #     - name: Upload tests coverage report to Codecov
  #       run: ./codecov --verbose upload-process -t ${{ secrets.CODECOV_TOKEN }} -n ${{github.run_number}}-${{github.run_attempt}}-coverage -F unit -f ./coverage/coverage-unit.json

  check-e2e-tags:
    # PR-only. Guards e2e spec hygiene, which is meaningless when e2e is not running.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
      - name: Check e2e tags
        run: |
          ./scripts/check-e2e-tests-for-tags

  check-cypress-build:
    # PR-only. Separate yarn install under cypress/; too slow for the merge queue.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
      - name: Verify Cypress build
        working-directory: ./cypress
        run: |
          yarn install --frozen-lockfile
          yarn build-pkg --verify

  # Store the PR number in an artifact for use in TestHub registration since workflow_run triggered by PRs doesn't include the PR number in the head branch or commit message
  store-origin:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Save PR number or Branch name
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          mkdir -p ./origin

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Storing PR number ${PR_NUMBER} for TestHub registration"
            echo "pr/$PR_NUMBER" > ./origin/origin
          else
            echo "Storing branch name ${GITHUB_REF_NAME} for TestHub registration"
            echo "branch/$GITHUB_REF_NAME" > ./origin/origin
          fi

          cat ./origin/origin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload origin artifact
        with:
          name: origin
          path: origin/

  # ---------------------------------------------------------------------------
  # SOLE required status check produced by this workflow, on pull requests and in
  # the merge queue alike. Do not rename it without updating branch protection.
  #
  # Keep it side-effect free. `auto-retry.yaml` re-runs failed jobs, and because
  # this job also concludes `failure` it is itself re-run — after the jobs it
  # depends on, since `gh run rerun --failed` respects the `needs` graph.
  #
  # `if: always()` is load-bearing. Without it the gate is skipped whenever a
  # dependency fails, and `skipped` is not a success for branch protection or for
  # the merge queue — the queue would wait out the status-check timeout and then
  # eject the pull request.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: ci-gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      # Always-on. These four are the merge-queue check set: cheap, deterministic,
      # and free of secrets (merge-group runs are trusted, unlike fork PR runs).
      - lint
      - type-check
      - unit-test
      - i18n
      # PR-only. Legitimately `skipped` on merge_group, and skippable on PRs via
      # the ci/skip-e2e label.
      - extract-e2e-runtime-rancher-version
      - e2e-ui-build
      - e2e-test
      - a11y-test
      - check-i18n
      - check-i18n-links
      - check-e2e-tags
      - check-cypress-build
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      # A gate that passes unconditionally would silently remove every required
      # check in the repository, so verify the evaluator before trusting it. Two
      # seconds, no dependencies, and it runs in the merge queue too.
      - name: Self-test the gate evaluator
        run: ./.github/actions/gate/evaluate-gate.test.sh

      - name: Evaluate results
        uses: ./.github/actions/gate
        with:
          needs: ${{ toJSON(needs) }}
          skippable: >-
            extract-e2e-runtime-rancher-version e2e-ui-build e2e-test a11y-test
            check-i18n check-i18n-links check-e2e-tags check-cypress-build
          # a11y-test is not a required status check today, so folding it into this
          # gate must not silently start blocking merges. Remove it from `soft`
          # once the a11y ratchet has completed its soft-launch window.
          soft: a11y-test
