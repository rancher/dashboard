  order:
    label: Order
    url: ACME Order URL
    finalizeUrl: Finalize URL
    identifier: Identifier
    wildcard: Wildcard
    challengeTypes: Challenge Types
    noAuthorizations: This order has no authorizations yet.
    tab:
