import:
  label: Generic
imported:
  label: Imported
  agentEnv:
    header: Agent Environment Variables
  configureAfterImport:
    versionManagement: For RKE2 and K3s clusters, K8s Version Management will be automatically {versionManagement} based on the corresponding global setting. This behavior can be modified and configured once the cluster has been imported.
    versionManagementAndDayTwoOps: For RKE2 and K3s clusters, K8s Version Management will be automatically {versionManagement} and Day 2 Operations will be automatically {dayTwoOps} based on the corresponding global settings. This behavior can be modified and configured once the cluster has been imported.
    versionManagementAndDayTwoOpsSame: For RKE2 and K3s clusters, K8s Version Management and Day 2 Operations will be automatically {state} based on the corresponding global settings. This behavior can be modified and configured once the cluster has been imported.
    enabled: enabled
    disabled: disabled
  basics:
    versionMismatch: "There is a mismatch between the expected and the current versions of the cluster. This usually happens if the imported cluster was upgraded outside of this Rancher instance. Managing the cluster version via Rancher and external means at the same time is not supported and may cause unexpected behavior and failures. <br>Please consider disabling the version management feature if the cluster has been upgraded externally."
    versionManagement:
      title: K8s version management
      globalEnabled: Global default (enabled)
      globalDisabled: Global default (disabled)
      enabled: Enabled
      disabled: Disabled
      banner:
        create:
          nonDefault:
            Future changes to this setting may result in redeployment of the cluster agent.
          default:
            Future changes to the system default setting will result in redeployment of the cluster agent.
        edit:
          different: This change will trigger cluster agent redeployment.
          defaultToNonDefault: Future changes to the global setting will not affect the cluster.
          nonDefaultToDefault: Future changes to the global setting will affect the cluster.
      summary:
        globallyEnabled: 'Version management for imported clusters is globally <b>enabled</b>.'
        globallyDisabled: Version management for imported clusters is globally <b>disabled</b>.
        canEnable: You can enable it at a cluster level.
        willEnable: It will be manually <b>ENABLED</b> for this cluster.
        willDisable: it will be manually <b>DISABLED</b> for this cluster.
    dayTwoOpsEnabled:
      title: Day 2 Operations
      description: Snapshot creation, snapshot restoration, and encryption key rotation.
      label: Enable snapshot creation, snapshot restoration, and encryption key rotation
      globallyEnabled: 'Day 2 Operations for imported clusters are globally <b>enabled</b>.'
      globallyDisabled: 'Day 2 Operations for imported clusters are globally <b>disabled</b>.'
      enabled: Enabled
      disabled: Disabled
      globalEnabledDefault: Global default (enabled)
      globalDisabledDefault: Global default (disabled)
      banner:
        edit:
          defaultToNonDefault: Future changes to the global setting will not affect the cluster.
          nonDefaultToDefault: Future changes to the global setting will affect the cluster.
      summary:
        canEnable: You can enable it at a cluster level.
        willEnable: It will be manually <b>ENABLED</b> for this cluster.
        willDisable: It will be manually <b>DISABLED</b> for this cluster.
  drainWorkerNodes:
    label: Drain Worker Nodes
  drainControlPlaneNodes:
