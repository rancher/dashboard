<?xml version="1.0" encoding="utf-8"?>
<!-- Demo artwork for a Remuda environment. Replaces the stock login landscape
     with something unmistakable at a glance, so one branch build can be told
     from another on a projector. Composition is centred and layered, because
     the image is rendered with object-fit: cover and is cropped at most
     viewport widths. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 682.5 768" preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1f33"/>
      <stop offset="55%" stop-color="#14304a"/>
      <stop offset="100%" stop-color="#1f6f6b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4a259" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f4a259" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="682.5" height="768" fill="url(#sky)"/>

  <circle cx="341.25" cy="300" r="96" fill="url(#glow)"/>
  <circle cx="341.25" cy="300" r="62" fill="#f6c177"/>

  <g fill="#0f2740">
    <path d="M0 524 L140 452 L268 520 L400 440 L536 512 L682.5 448 L682.5 768 L0 768 Z" opacity="0.55"/>
    <path d="M0 596 L118 540 L252 604 L388 532 L520 596 L682.5 540 L682.5 768 L0 768 Z" opacity="0.75"/>
    <path d="M0 668 L160 616 L320 676 L470 620 L682.5 668 L682.5 768 L0 768 Z"/>
  </g>

  <g stroke="#2a9d8f" stroke-width="3" fill="none" opacity="0.8">
    <path d="M60 724 L622 724"/>
    <path d="M60 740 L360 740"/>
  </g>
</svg>
